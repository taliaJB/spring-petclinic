apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}{{ .Values.db.name }}"
  labels:
    app: "{{ .Values.db.label }}"
spec:
  selector:
    matchLabels:
      app: "{{ .Values.db.labelSelector }}"
  replicas: {{ default 1 .Values.db.replicas | int }}
  template:
    metadata:
      labels:
        app: "{{ .Values.db.label }}"
    spec:
      containers:
      - name: "{{ .Values.db.container.name }}"
        image: "{{ .Values.db.container.image.name }}:{{ .Values.db.container.image.tag }}"
        env:          
          - name: "MYSQL_ALLOW_EMPTY_PASSWORD"
            value: "{{ .Values.db.env.allowEmptyPassword }}"
          - name: "MYSQL_DATABASE"
            value: "{{ .Values.db.env.database }}"
          - name: "MYSQL_PASSWORD"
            value: "{{ .Values.db.env.password }}"
          - name: "MYSQL_ROOT_PASSWORD"
            value: "{{ .Values.db.env.rootPassword }}"
          - name: "MYSQL_USER"
            value: "{{ .Values.db.env.user }}"
        ports:
        - containerPort: {{ .Values.db.container.port | int }}
